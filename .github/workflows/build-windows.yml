name: Собрать Windows-версию

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Собрать portable ChatGrab.exe
        run: pyinstaller packaging/chatgrab.spec --noconfirm --clean

      - name: Проверить, что exe собрался
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ChatGrab.exe")) {
            throw "ChatGrab.exe не найден в dist/"
          }
          Get-Item "dist/ChatGrab.exe" | Select-Object Name, Length

      - name: Загрузить как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ChatGrab-windows
          path: dist/ChatGrab.exe
          if-no-files-found: error

      - name: Опубликовать релиз (по тегу v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/ChatGrab.exe" `
            --title "ChatGrab ${{ github.ref_name }}" `
            --notes "Portable-сборка ChatGrab для Windows. Скачайте ChatGrab.exe и запустите — установка не нужна."
