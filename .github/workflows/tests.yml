name: Тесты и проверка зависимостей

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  schedule:
    # Раз в неделю: аудит зависимостей должен ловить уязвимости,
    # опубликованные уже после того, как код перестали трогать.
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: Регрессионные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные библиотеки для Qt
        # PySide6 линкуется с ними даже в offscreen-режиме: без libEGL
        # импорт QtWidgets падает ещё до создания приложения.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Прогнать тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "OK: $t"
            else
              echo "::error file=$t::тест не прошёл"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Проверить, что все экраны открываются
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_screens.py

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Проверить requirements.txt
        # Аудит идёт по файлу требований, без установки Qt и прочего
        # тяжёлого — быстрее и не зависит от системных библиотек.
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off
